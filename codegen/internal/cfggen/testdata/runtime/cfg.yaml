# The meta file the runtime gate generates from. It is deliberately the
# awkward shapes, not the pretty ones: a bean inside a slice, a secondary
# index, a cross-table ref, a required field, a keyword-named field, and a
# global. Everything here must survive the real configdata runtime, not just
# gofmt. spawn / item add the index options (skipempty, an explicit index
# name, uint64 / bool / string / negative int64 values) and a string-keyed
# ref that points forward to a table declared after it.
package: cfg
beans:
  - name: DropItem
    fields:
      - { name: item_id, type: int32 }
      - { name: weight,  type: int32 }
tables:
  - name: spawn
    key: id
    fields:
      - { name: id,        type: int32 }
      - { name: zone_id,   type: uint64, index: true, skipempty: true }
      - { name: item_code, type: string, ref: item }
      - { name: elite,     type: bool,   index: true, skipempty: true }
      - { name: tag,       type: string, index: true }
  - name: drop
    key: id
    comment: drop groups
    fields:
      - { name: id,    type: int32 }
      - { name: items, type: "[]DropItem" }
  - name: monster
    key: id
    comment: monsters
    fields:
      - { name: id,       type: int32 }
      - { name: name,     type: string, required: true }
      - { name: scene_id, type: int32, index: true }
      - { name: drop_id,  type: int32, ref: drop, required: true }
      # "range" is a Go keyword: the generated accessor parameters and struct
      # field must still compile.
      - { name: range,    type: int32, min: 1 }
  - name: item
    key: code
    fields:
      - { name: code,  type: string }
      - { name: rare,  type: bool,  index: rarity }
      - { name: level, type: int64, index: true }
globals:
  - name: world
    fields:
      - { name: width,  type: int32 }
      - { name: height, type: int32 }
