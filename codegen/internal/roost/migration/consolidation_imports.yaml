    - package: github.com/tjbdwanghaibo/roost-core/kit/syncbus
      guide: "改名为 syncbus.NewSyncBusMod / syncbus.SyncBusMod（upgrade 对已确认的 kit import 自动改写；这里是残留）。见 CHANGELOG「room/ 包退场」"
