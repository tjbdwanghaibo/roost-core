# Package relocation map for the Roost consolidation (five repos -> three).
#
# This file is the single source of truth for:
#   * the migration batches (what moves where),
#   * `roost upgrade --consolidate` (import rewriting in business projects),
#   * the ledger's "new location" column.
# It maps PACKAGE PATHS only. There is deliberately no per-symbol rename table:
# the few symbols whose home or name changed in the merge (core/nats.Permanent
# stays in the contract package; kit/syncstream.HealthOptions / HealthStatus are
# core/syncstream.PublisherHealthOptions / PublisherHealthStatus) are left for
# the compiler to point out after the rewrite — see roost-core TROUBLESHOOTING T-45.
# Draft written at P0 from docs/ARCHITECTURE_V2_CONSOLIDATION_PLAN.zh-CN.md §2;
# `kit_keeps` = exported symbols of the Mod glue file that stays in kit. The glue
# file is identified by CONTENT (a type with Provide/Init methods), not by name:
# it is `*_mod.go` in most packages but `mod.go` in dataengine/saga and
# `configdata.go` / `statslog.go` there. Refreshed again at P3 from what actually stays.
schema: 2
boundary:
  # First versions that ship the consolidated layout. Crossing them requires
  # the rewrite below; older tags keep the old layout forever.
  core: v1.14.0
  kit: v1.13.0
  codegen: v1.15.0
removed_modules:
  - github.com/tjbdwanghaibo/roost-skill
  - github.com/tjbdwanghaibo/roost-service

# Second stage: three repositories to one (core v1.16.0). kit and codegen stop
# being modules and become directories inside roost-core, so this stage needs
# no per-package table — two prefixes cover everything that is left.
#
# ORDER MATTERS. The stage above moved most of kit's implementation packages
# into core PROPER (roost-kit/dataengine → roost-core/dataengine), and only what
# stayed behind — the Mod glue and service/ — is what this stage relocates
# (roost-kit/service/mail → roost-core/kit/service/mail). Applying the prefix
# first would send dataengine to roost-core/kit/dataengine, where it does not
# live. The rewriter therefore resolves stage one and prefixes the RESULT.
single_module:
  boundary:
    core: v1.16.0
  removed_modules:
    - github.com/tjbdwanghaibo/roost-kit
    - github.com/tjbdwanghaibo/roost-codegen
  prefix:
    - from: github.com/tjbdwanghaibo/roost-kit
      to: github.com/tjbdwanghaibo/roost-core/kit
    - from: github.com/tjbdwanghaibo/roost-codegen
      to: github.com/tjbdwanghaibo/roost-core/codegen
# Split packages: the implementation moves to roost-core/<pkg>; the Mod glue
# (kit_keeps) stays in roost-kit/<pkg>. A file that uses both needs both imports.
split:
  - kit: github.com/tjbdwanghaibo/roost-kit/actionflow
    core: github.com/tjbdwanghaibo/roost-core/actionflow
    kit_keeps: []
  - kit: github.com/tjbdwanghaibo/roost-kit/ai
    core: github.com/tjbdwanghaibo/roost-core/ai
    kit_keeps: []
  - kit: github.com/tjbdwanghaibo/roost-kit/dataengine
    # The contract package core/dataengine is imported by core/nest and core/nestwal,
    # which the implementation itself imports: merging would cycle. The implementation
    # therefore lives in the subpackage `engine` (package name engine). P2-④.
    core: github.com/tjbdwanghaibo/roost-core/dataengine/engine
    package: engine
    kit_keeps: ['Mod', 'ModOption', 'NewMod', 'WithEntityAccess', 'WithRemoteProjection']
  - kit: github.com/tjbdwanghaibo/roost-kit/etcd
    # Implementation lives in the driver subpackage (B-26): the contract package
    # github.com/tjbdwanghaibo/roost-core/etcd stays free of driver dependencies.
    core: github.com/tjbdwanghaibo/roost-core/etcd/driver
    package: driver
    kit_keeps: ['EtcdMod', 'NewEtcdMod']
  - kit: github.com/tjbdwanghaibo/roost-kit/gateway
    core: github.com/tjbdwanghaibo/roost-core/gateway
    kit_keeps: []
  - kit: github.com/tjbdwanghaibo/roost-kit/lockstep
    core: github.com/tjbdwanghaibo/roost-core/lockstep
    kit_keeps: []
  - kit: github.com/tjbdwanghaibo/roost-kit/mongo
    # Implementation lives in the driver subpackage (B-26): the contract package
    # github.com/tjbdwanghaibo/roost-core/mongo stays free of driver dependencies.
    core: github.com/tjbdwanghaibo/roost-core/mongo/driver
    package: driver
    kit_keeps: ['MongoMod', 'NewMongoMod']
  - kit: github.com/tjbdwanghaibo/roost-kit/nats
    # Implementation lives in the driver subpackage (B-26): the contract package
    # github.com/tjbdwanghaibo/roost-core/nats stays free of driver dependencies.
    core: github.com/tjbdwanghaibo/roost-core/nats/driver
    package: driver
    kit_keeps: ['NatsMod', 'NewNatsMod']
  - kit: github.com/tjbdwanghaibo/roost-kit/redis
    # Implementation lives in the driver subpackage (B-26): the contract package
    # github.com/tjbdwanghaibo/roost-core/redis stays free of driver dependencies.
    core: github.com/tjbdwanghaibo/roost-core/redis/driver
    package: driver
    kit_keeps: ['NewRedisMod', 'RedisMod']
  - kit: github.com/tjbdwanghaibo/roost-kit/robot
    core: github.com/tjbdwanghaibo/roost-core/robot
    kit_keeps: []
  - kit: github.com/tjbdwanghaibo/roost-kit/saga
    core: github.com/tjbdwanghaibo/roost-core/saga
    kit_keeps: ['CombineDefinitions', 'Mod', 'NewMod']
  - kit: github.com/tjbdwanghaibo/roost-kit/syncstream
    core: github.com/tjbdwanghaibo/roost-core/syncstream
    kit_keeps: []
# Whole packages that move from roost-kit to roost-core (Mod glue, if any, stays).
move:
  - from: github.com/tjbdwanghaibo/roost-kit/nestwal
    to: github.com/tjbdwanghaibo/roost-core/nestwal
  - from: github.com/tjbdwanghaibo/roost-kit/remoteentity
    to: github.com/tjbdwanghaibo/roost-core/remoteentity
    kit_keeps: ['ModOption', 'NewRemoteEntityMod', 'RemoteEntityMod', 'WithBackend', 'WithMongoStorage']
  - from: github.com/tjbdwanghaibo/roost-kit/room
    to: github.com/tjbdwanghaibo/roost-core/syncbus/driver
    kit_keeps: ['NewRoomMod', 'RoomMod'] # renamed to NewSyncBusMod / SyncBusMod in kit/syncbus (ARCH-10 follow-up)
  - from: github.com/tjbdwanghaibo/roost-kit/nettransport
    to: github.com/tjbdwanghaibo/roost-core/nettransport
  - from: github.com/tjbdwanghaibo/roost-kit/spatial
    to: github.com/tjbdwanghaibo/roost-core/spatial
  - from: github.com/tjbdwanghaibo/roost-kit/versionstore
    to: github.com/tjbdwanghaibo/roost-core/versionstore
  - from: github.com/tjbdwanghaibo/roost-kit/servicerpc
    to: github.com/tjbdwanghaibo/roost-core/servicerpc
  - from: github.com/tjbdwanghaibo/roost-kit/mongo/mongotest
    to: github.com/tjbdwanghaibo/roost-core/mongo/mongotest
# Packages that stay in roost-kit unchanged.
keep:
  # nest and lock in kit are Mod glue only (nest_mod.go / lock_mod.go + tests); nothing to sink.
  - github.com/tjbdwanghaibo/roost-kit/nest
  - github.com/tjbdwanghaibo/roost-kit/lock
  # configdata and statslog are one file each: the Mod plus project-config translation
  # (configdata) / stats providers wired to the Mod (statslog). Assembly-layer by definition.
  - github.com/tjbdwanghaibo/roost-kit/configdata
  - github.com/tjbdwanghaibo/roost-kit/statslog
  - github.com/tjbdwanghaibo/roost-kit/manager
  - github.com/tjbdwanghaibo/roost-kit/mods
  - github.com/tjbdwanghaibo/roost-kit/ops
# roost-skill -> roost-core/skill/...
skill:
  - from: github.com/tjbdwanghaibo/roost-skill/skill
    to: github.com/tjbdwanghaibo/roost-core/skill
  - from: github.com/tjbdwanghaibo/roost-skill/combat
    to: github.com/tjbdwanghaibo/roost-core/skill/combat
  - from: github.com/tjbdwanghaibo/roost-skill/combatcomponent
    to: github.com/tjbdwanghaibo/roost-core/skill/combatcomponent
  - from: github.com/tjbdwanghaibo/roost-skill/skillcompose
    to: github.com/tjbdwanghaibo/roost-core/skill/skillcompose
  - from: github.com/tjbdwanghaibo/roost-skill/skillsync
    to: github.com/tjbdwanghaibo/roost-core/skill/skillsync
# roost-service -> roost-kit/service/...; servicemods constants fold into roost-kit/mods.
service:
  - from: github.com/tjbdwanghaibo/roost-service/servicemods
    to: github.com/tjbdwanghaibo/roost-kit/mods
  - from: github.com/tjbdwanghaibo/roost-service/servicemetrics
    to: github.com/tjbdwanghaibo/roost-kit/service/servicemetrics
  - from: github.com/tjbdwanghaibo/roost-service/account
    to: github.com/tjbdwanghaibo/roost-kit/service/account
  - from: github.com/tjbdwanghaibo/roost-service/chat
    to: github.com/tjbdwanghaibo/roost-kit/service/chat
  - from: github.com/tjbdwanghaibo/roost-service/directory
    to: github.com/tjbdwanghaibo/roost-kit/service/directory
  - from: github.com/tjbdwanghaibo/roost-service/global
    to: github.com/tjbdwanghaibo/roost-kit/service/global
  - from: github.com/tjbdwanghaibo/roost-service/global/activity
    to: github.com/tjbdwanghaibo/roost-kit/service/global/activity
  - from: github.com/tjbdwanghaibo/roost-service/mail
    to: github.com/tjbdwanghaibo/roost-kit/service/mail
  - from: github.com/tjbdwanghaibo/roost-service/match
    to: github.com/tjbdwanghaibo/roost-kit/service/match
  - from: github.com/tjbdwanghaibo/roost-service/platform
    to: github.com/tjbdwanghaibo/roost-kit/service/platform
  - from: github.com/tjbdwanghaibo/roost-service/rank
    to: github.com/tjbdwanghaibo/roost-kit/service/rank
  - from: github.com/tjbdwanghaibo/roost-service/session
    to: github.com/tjbdwanghaibo/roost-kit/service/session

# Third stage: the sync block gathers under sync/ (ARCH-12 S3, core v1.17.0).
# Applied to the RESULT of the two stages above. `package` names the new
# package where it differs from the last path element's old name; symbols of
# statesync that dropped their Frame prefix (EncodeFrame → frame.Encode,
# DecodeFrame → frame.Decode, DeltaFrame → frame.Frame, FrameFull / FrameDelta
# → frame.Full / frame.Delta) are not rewritten; `removed:` below makes
# upgrade list them (and every other symbol that did not survive) with a guide
# instead of leaving them to the compiler, see TROUBLESHOOTING T-175.
layout:
  boundary:
    core: v1.17.0
  move:
    - from: github.com/tjbdwanghaibo/roost-core/room
      to: github.com/tjbdwanghaibo/roost-core/sync/syncbus/driver
      package: driver
    - from: github.com/tjbdwanghaibo/roost-core/kit/room
      to: github.com/tjbdwanghaibo/roost-core/kit/syncbus
      package: syncbus
    - from: github.com/tjbdwanghaibo/roost-core/entitysync
      to: github.com/tjbdwanghaibo/roost-core/sync/entitysync
    - from: github.com/tjbdwanghaibo/roost-core/statesync
      to: github.com/tjbdwanghaibo/roost-core/sync/frame
      package: frame
    - from: github.com/tjbdwanghaibo/roost-core/nettransport
      to: github.com/tjbdwanghaibo/roost-core/sync/nettransport
    - from: github.com/tjbdwanghaibo/roost-core/lockstep
      to: github.com/tjbdwanghaibo/roost-core/sync/lockstep
    - from: github.com/tjbdwanghaibo/roost-core/syncbus
      to: github.com/tjbdwanghaibo/roost-core/sync/syncbus
    - from: github.com/tjbdwanghaibo/roost-core/mirror
      to: github.com/tjbdwanghaibo/roost-core/sync/syncbus/mirror
  # Exported identifiers that existed in v1.16.1 and are gone at the path the
  # rewrite leaves them on (API diff v1.16.1 → the layout boundary, top-level
  # declarations only; methods, fields and signatures are still the
  # compiler's). They cannot be rewritten mechanically — a different package,
  # a different shape, or no replacement at all — so `upgrade --consolidate`
  # lists every use as file:line with the guide and exits non-zero instead of
  # reporting success (RR-20260926-24 复核残留).
  removed:
    - package: github.com/tjbdwanghaibo/roost-core/sync/frame
      guide: "同包改名（M-17 去掉重复前缀）：EncodeFrame → Encode、DecodeFrame → Decode、DeltaFrame → Frame、FrameFull → Full、FrameDelta → Delta、FrameKind → Kind。见 CHANGELOG「同步块收进 sync/」、TROUBLESHOOTING T-175"
      symbols: [EncodeFrame, DecodeFrame, DeltaFrame, FrameFull, FrameDelta, FrameKind]
    - package: github.com/tjbdwanghaibo/roost-core/sync/frame
      guide: "移到 sync/nettransport，名字不变（M-16）：import \"github.com/tjbdwanghaibo/roost-core/sync/nettransport\" 后写 nettransport.<同名>。见 CHANGELOG「传输契约归位 nettransport」、docs/bugfix/M-16-transport-contracts-home.md"
      symbols: [DatagramBatchTransport, DefaultMaxDatagram, ErrTransportMissing, SessionID, SessionInfo, SessionTransport, Transport, TransportFunc]
    - package: github.com/tjbdwanghaibo/roost-core/sync/frame
      guide: "已删除，无替代（M-16 移到 nettransport 后 M-18 删除 datagram 分片通道）：实体同步只走 reliable（nettransport.AsyncTransport），每帧直接 frame.Decode / entitysync.DecodeFrame，不再分片重组。见 CHANGELOG「nettransport.AsyncTransport 只留 reliable」、docs/bugfix/M-18-async-transport-reliable-only.md"
      symbols: [DatagramFlagFull, DatagramFlags, DatagramHeader, DatagramHeaderSize, DecodeDatagram, FragmentFrame, InspectDatagram, ErrFragmentLimit, ErrInvalidDatagram]
    - package: github.com/tjbdwanghaibo/roost-core/sync/frame
      guide: "已删除，无替代（M-15：ARCH-10 之后没有调用者的 Replicator / SessionState / LOD / Snapshot / Schema / 控制消息 / Reassembler 一族）：实体同步用 sync/entitysync.Manager；客户端解码用 entitysync.DecodeFrame + entitysync.DecodeSubjectUpdate（线格式 v2 一帧一包，无需 Reassembler）。demo 的 cmd/loadtest、scene.go、scene_test.go 按当前模板重生成或人工合并。见 CHANGELOG「statesync 只剩帧格式」、docs/bugfix/M-15-statesync-dead-code.md、docs/bugfix/M-13-entitysync-manager.md"
      symbols: [ApplyDelta, BuildDelta, CodecGeneratedBitset, CodecGeneratedDelta, CodecRaw, CodecType, ComponentLODPolicy, ComponentSchema, ComponentState, ContextProjector, ControlAck, ControlMessage, ControlMessageSize, ControlResync, ControlType, DecodeControl, DefaultSnapshotRateHz, EncodeControl, ErrChecksumMismatch, ErrInvalidAck, ErrInvalidControl, ErrInvalidLOD, ErrObjectNotFound, ErrPreparedFrameStale, ErrReassemblyCapacity, ErrReplicatorClosed, ErrSchemaFrozen, ErrSessionNotFound, ErrSnapshotNotFound, IsControlPayload, LODAtAll, LODAtFull, LODAtLow, LODAtMinimal, LODAtReduced, LODCulled, LODDecision, LODFull, LODLevel, LODLow, LODMask, LODMinimal, LODProjector, LODProjectorConfig, LODProjectorStats, LODReduced, LODSelector, LODSelectorFunc, Lane, LaneEvent, LaneLifecycle, LaneState, LaneStatic, NewLODMask, NewLODProjector, NewReassembler, NewReplicator, NewSchemaRegistry, NewSessionState, NewShadowStore, NewSnapshot, NewSnapshotRing, ObjectState, PreparedFrame, Priority, PriorityCosmetic, PriorityCritical, PriorityHigh, PriorityLow, PriorityNormal, ProjectionContext, Projector, ProjectorFunc, Reassembler, Reliability, ReliabilityReliableOrdered, ReliabilityUnreliableEvent, ReliabilityUnreliableLatest, ReplicationPolicy, Replicator, ReplicatorConfig, ReplicatorStats, ResyncBaselineMissing, ResyncDecodeFailure, ResyncReason, ResyncReassemblyExpired, ResyncSchemaMismatch, ResyncUnknown, SchemaRegistry, SessionSnapshot, SessionState, ShadowStore, Snapshot, SnapshotRing, Visibility, VisibilityCustom, VisibilityOwner, VisibilityPublic, VisibilitySpectator, VisibilityTeam]
    - package: github.com/tjbdwanghaibo/roost-core/sync/syncbus/driver
      guide: "改用 sync/entitysync 的线格式函数（M-13 线格式 v2 去掉 room 帧头）：DecodeRoomWireFrame → entitysync.DecodeFrame(data, frame.DefaultLimits())、DecodeRoomSubjectUpdate → entitysync.DecodeSubjectUpdate(data, maxBytes)、EncodeRoomSubjectUpdate → entitysync.EncodeSubjectUpdate(update, maxBytes)。见 CHANGELOG「实体同步统一为 entitysync.Manager」、docs/bugfix/M-13-entitysync-manager.md"
