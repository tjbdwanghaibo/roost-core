      symbols: [DeliveryEnvelope, EnvelopeDelta, EnvelopeKind, EnvelopeLeave, EnvelopeSnapshot, ErrCoordinatorClosed, ErrEnvelopeAdmission, ErrEnvelopeSinkRequired, ErrPreparedProfilesMissing, ErrSubscriberInvalid, ErrSubscriptionState, ErrSubscriptionSubject, NewSubscriptionCoordinator, ReliableEnvelopeSink, ReliableEnvelopeSinkFunc, SubscriberKind, SubscriberKindEntity, SubscriberKindGroup, SubscriberKindNone, SubscriberKindPlayer, SubscriberKindServer, SubscriberRef, Subscription, SubscriptionActive, SubscriptionClosing, SubscriptionCoordinator, SubscriptionPending, SubscriptionState]
    - package: github.com/tjbdwanghaibo/roost-core/sync/nettransport
