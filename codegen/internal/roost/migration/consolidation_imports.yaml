    - package: github.com/tjbdwanghaibo/roost-core/spatial
      guide: "搬到 sync/entitysync/policy 并改名（M-17）：InterestManager → policy.AOI、NewInterestManager → policy.NewAOI、InterestCluster → policy.AOICluster、NewInterestCluster → policy.NewAOICluster、InterestConfig → policy.AOIConfig（不是 policy.InterestConfig）、RoomID → policy.AreaID、ErrRoomDuplicate / ErrRoomOverlap / ErrRoomUnknown → policy.ErrAreaDuplicate / ErrAreaOverlap / ErrAreaUnknown、AddRoom → AddArea。见 CHANGELOG「同步块收进 sync/」、TROUBLESHOOTING T-175"
