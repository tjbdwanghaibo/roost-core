# Generated starter configuration; application-owned after project creation.
sid: 1000
log:
  level: info
  json: true
  stdout: true
  file: false
  dir: log
shutdown:
  total_timeout: 30s
  serve_wait_timeout: 5s
ops:
  enabled: true
  addr: 0.0.0.0:9100
  admin_enabled: false
  admin_token: ""
  allow_dev_token: false
stats_log:
  enabled: true
  dir: log
  interval: 1m
redis:
  addr: CHANGE_ME:6379
  password: ""
  db: 0
  pool_size: 32
  min_idle_conns: 4
nats:
  url: nats://CHANGE_ME:4222
  prefix: roost
  worker_num: 8
  reliable:
    enabled: false
chat:
  key_prefix: roost:planet:chat
  retention_age: 168h
  prune_channels: []
