# Generated starter configuration; application-owned after project creation.
sid: 1000
log:
  level: info
  json: true
  stdout: true
  file: true
  dir: log
shutdown:
  # Whole shutdown window: Service.Shutdown, then every Mod in reverse order. Every Mod without
  # a declared stop budget keeps a fixed 3s floor; a Mod that declares one
  # (dataengine.shutdown_timeout) is granted it from the rest, scaled down with a warning only
  # when the rest cannot cover it. Generated for this service's 25 Mods: 40s declared + 3s x 23
  # undeclared + 5s for Service.Shutdown + 3s for the singleton release = 117s (the App keeps the
  # release share back from the Mods while singleton.enabled is true). roost sync updates this
  # block while it is unedited when the service's Mods change; roost doctor checks an edited one.
  # The deployment's termination grace period (k8s terminationGracePeriodSeconds, compose
  # stop_grace_period, systemd TimeoutStopSec, deploy/dev/run.sh) must be
  # >= total_timeout + 5s: 122s for this service.
  total_timeout: 117s
ops:
  # 打开 ops 端点（/healthz、/readyz、/metrics、/statsz、/admin）
  enabled: true
  # ops 端点监听地址；生产环境绑公网要同时写 ops.allow_public_addr: true
  addr: 127.0.0.1:9100
  # 打开 /admin 命令；打开时必须写 ops.admin_token
  admin_enabled: true
  # /admin 的令牌；生产禁止 dev-，开发使用 dev- 时须写 ops.allow_dev_token: true
  admin_token: dev-gm-token
  allow_dev_token: true
stats_log:
  # 按 interval 把指标快照写进 stats 日志
  enabled: true
  # stats 日志目录（相对进程工作目录，部署要给它可写的挂载）
  dir: log
  interval: 1m
config_data:
  # 配置表目录（相对进程工作目录）
  dir: configs/data
mongo:
  uri: mongodb://127.0.0.1:27017/?replicaSet=rs0
  connect_timeout: 5s
  transaction_timeout: 30s
  # 要求副本集（事务需要它）；只在确知用不到事务的单机环境写 false
  require_replica_set: true
  max_pool_size: 100
  min_pool_size: 5
  max_idle_time: 5m
nats:
  url: nats://127.0.0.1:4222
  # bus 主题前缀。生成配置按工程名填写：同一工程的所有服务必须一致，共用一套 NATS 的不同工程必须不同
  prefix: planet
  worker_num: 8
  reliable:
    # 可靠总线（需要 Redis Mod）
    enabled: false
persistence:
  # 持久化引擎；只支持 dataengine
  engine: dataengine
nest:
  short:
    workers: 0
    queue_capacity: 0
  io:
    workers: 0
    queue_capacity: 0
  long:
    workers: 0
    queue_capacity: 0
  delayed_capacity: 4096
  max_delay: 24h
  tick_duration: 50ms
  request_timeout: 3s
  # Framework cap for one shared cold entity load; a caller's own deadline does not end it.
  entity_load_timeout: 30s
  # Reload of unloaded entities that still have Sync subscribers (0 keeps the framework
  # default). Worst case before the last queued entity falls back to a remove is about
  # ceil((queue_capacity+workers)/workers) * T_entity (all attempts plus retry backoff); see docs/framework/guide/04-sync.md.
  unload_resync:
    workers: 4
    attempts: 5
    queue_capacity: 4096
  pipelined:
    allowlist: []
    async: false
    async_workers: 8
    async_queue_capacity: 4096
dataengine:
  # Data Engine 自己的集合（receipts / transactions / outbox）所在的 Mongo 库。生成配置按工程名填写，与 DAO 骨架的 db= 同一规则；共用一个 Mongo 的不同工程必须不同
  database: planet
  startup_timeout: 30s
  # Stop budget declared to the App for draining WAL and projection; granted from
  # shutdown.total_timeout after a 3s floor for each other Mod (scaled down with a warning
  # only when the rest cannot cover it). The generated shutdown.total_timeout counts it:
  # raise that too when raising this.
  shutdown_timeout: 30s
  transaction_receipt_ttl: 720h
  receipt_ttl: 720h
  wal:
    # 不写取 data/wal/dataengine/<sid>
    dir: data/wal/dataengine
    segment_bytes: 268435456
    max_disk_bytes: 8589934592
    max_unacked_age: 24h
    queue_capacity: 8192
    group_commit_interval: 2ms
  projection:
    batch_records: 256
    retry_min: 100ms
    retry_max: 5s
  outbox:
    workers: 2
    batch_size: 64
    lease_duration: 30s
    poll_interval: 100ms
    retry_min: 1s
    retry_max: 1m
    max_pending: 1000000
    max_oldest_age: 30m
  effects:
    subject_prefix: planet.effect
    stream: PLANET_EFFECTS
    max_age: 168h
    max_bytes: 8589934592
    duplicate_window: 10m
    replicas: 1
redis:
  # 单机 Redis 地址
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  # 连接池大小，0 取驱动默认
  pool_size: 32
  # 最少空闲连接，0 取驱动默认
  min_idle_conns: 4
syncbus:
  # 服务间同步总线：nats 或 jetstream（持久投递）
  transport: jetstream
  # 主题前缀
  prefix: planet.sync
  storage: file
  replicas: 1
  publish_timeout: 3s
remote_entity:
  lock_ttl: 15s
  retry_count: 3
  retry_delay: 100ms
  op_timeout: 3s
  unlock_retry_count: 5
  unlock_retry_interval: 100ms
  version_ttl: 24h
  finalize_retry_interval: 500ms
  max_write_batch: 64
  async_finalize_capacity: 4096
  async_finalize_workers: 16
  transaction_track_limit: 100000
  transaction_track_ttl: 10m
  wrapper_capacity: 65536
  wrapper_idle_ttl: 5m
  snapshot_cache_shards: 64
  snapshot_cache_entries: 10000
  snapshot_cache_bytes: 268435456
  snapshot_cache_ttl: 30s
  # Cached / Monotonic 读交出的快照距最近一次被共享 L2 或权威确认的最长时间，超过先重新确认，
  # 确认不了就不交出。不配置时等于 snapshot_cache_ttl（这里写成与它相同）；配置了必须为正。
  cached_max_staleness: 30s
  snapshot_l2_ttl: 10m
  # Prefix for the shared L2 snapshot keys (remote_entity:snapshot:*). Empty keeps the
  # unprefixed keys; deployments sharing one Redis db must set different values, e.g.
  # roost:<project>. Every node of a deployment must use the same value; no hash tags.
  snapshot_l2_key_prefix: ""
  # L2 写删除墓碑后用 WAIT 等几个副本确认、最多等多久，缩小切主时删除短暂复活的窗口。
  # 0 个副本即关闭；主节点没有副本时自动不等；确认不足只计数并记 Warn，不回滚。超时必须为正且不超过 1s。
  snapshot_l2_tombstone_wait_replicas: 1
  snapshot_l2_tombstone_wait_timeout: 50ms
  snapshot_interest_ttl: 30s
  snapshot_interest_keys: 10000
  snapshot_interest_subs: 100000
  # 每个 consumer 节点在兴趣表里的租约配额，0 取 snapshot_interest_subs / 16，不能超过 snapshot_interest_subs。
  # 超出配额的 key 没有推送、按需读取（计 interest_rejected_total{reason}）。
  snapshot_interest_per_consumer: 0
  marker_cache_ttl: 2s
  snapshot_load_timeout: 3s
  snapshot_max_waiters: 4096
  mongo:
    database: planet_remote
    transaction_ttl: 168h
  mirror:
    # 只读服务（wiring/remoteentity.NewRemoteMirrorMod）声明给 App 的停机预算，RemoteEntityMod 不读它。
    # 生成的 shutdown.total_timeout 与部署宽限期只计入生成器认识的 Mod，手工接入 Mirror Mod 时要一并调大。
    shutdown_timeout: 5s
etcd:
  # etcd 地址（逗号分隔或 YAML 列表）
  endpoints: [127.0.0.1:2379]
  username: ""
  password: ""
  # 服务注册的键前缀，不写取 etcd 包的缺省
  service_prefix: /planet/services/
  # 注册租约秒数，0 取 etcd 包的缺省
  lease_ttl: 10
  # 写进服务注册的地址（其他进程据此连接本服务）
  advertise_addr: 127.0.0.1:9000
singleton:
  # One process per server type + sid: before any Mod starts, the App takes the Redis key
  # <key_prefix>:<server_type>:<sid> (connecting with this file's redis.* settings), renews it,
  # stops the process when it is lost, and releases it after every Mod has stopped.
  # On by default for a service with the Data Engine (one WAL writer per sid). The App refuses
  # to start unless renew_interval <= guard, 2 x renew_interval <= ttl - guard and
  # startup_wait >= ttl + 2 x renew_interval. Raising startup_wait: raise the deployment's
  # start-up allowance with it (k8s startupProbe, compose start_period, HEALTH_ATTEMPTS).
  enabled: true
  key_prefix: roost:planet:singleton
  ttl: 15s
  renew_interval: 3s
  guard: 5s
  startup_wait: 30s
saga:
  database: planet_saga
  # Step timeout and retry budget. Fields a saga definition leaves unset
  # take these; one operation of a step gets up to max_attempts attempts, at most
  # one of which takes effect.
  step_defaults:
    timeout: 5s
    max_attempts: 5
    backoff_min: 100ms
    backoff_max: 5s
  # Per-step overrides, winning over the definition and step_defaults:
  # steps.<saga type>.<step name>.<timeout|max_attempts|backoff_min|backoff_max>.
  # debit's compensation is the refund, which only runs on the sender's sid: 15
  # attempts (>= 98s with backoff) outlast a crash restart of that sid
  # (startup_wait + ttl + 45s = 90s); see internal/service/game/gift_saga.go.
  steps:
    gift_item:
      debit:
        max_attempts: 15
  subject_prefix: planet.saga
  stream: PLANET_SAGA
  coordinator_workers: 4
  publisher_workers: 4
  coordinator_claim_batch: 3
  publisher_claim_batch: 1
  lease_duration: 15s
  store_timeout: 3s
  poll_interval: 100ms
  publish_timeout: 3s
  publish_backoff_min: 50ms
  publish_backoff_max: 5s
  completion_receipt_ttl: 720h
  stream_max_age: 168h
  stream_max_bytes: 8589934592
  duplicate_window: 10m
  replicas: 1
  result_ack_wait: 30s
  result_process_timeout: 3s
  result_max_deliver: 25000
  result_max_ack_pending: 256
  result_nak_backoff_min: 250ms
  result_nak_backoff_max: 30s
  start_effect_stream: PLANET_EFFECTS
  start_effect_prefix: planet.effect
  start_effect_durable: roost-saga-start
  start_effect_ack_wait: 30s
  start_effect_process_timeout: 3s
  start_effect_max_deliver: 25000
  start_effect_max_ack_pending: 256
  start_effect_nak_backoff_min: 250ms
  start_effect_nak_backoff_max: 30s
  # 不写由 core 推出
  result_effect_durable: roost-saga-start-result
  result_effect_ack_wait: 30s
  result_effect_process_timeout: 3s
  result_effect_max_deliver: 25000
  result_effect_max_ack_pending: 256
  result_effect_nak_backoff_min: 250ms
  result_effect_nak_backoff_max: 30s

player_access:
  require_write_gate: true
  tcp:
    heartbeat_enabled: true
    request_rate: 100
    request_burst: 200
    enabled: true
    addr: 0.0.0.0:7000
    max_connections: 10000
    max_connections_per_ip: 128
    max_handshakes: 1024
    max_handshake_bytes: 8192
    max_payload_bytes: 1048576
    handshake_timeout: 5s
    idle_timeout: 90s
    write_timeout: 5s
    shutdown_timeout: 10s
    dispatch_timeout: 0s
    login_timeout: 0s
activity:
  key_prefix: roost:planet:activity
  # The activity groups file: this server takes part in the group that
  # lists its sid, and the members whose process is up (the App singleton
  # lock's Live query) are what an activity waits for. The game refuses to
  # start when its sid is in no group or the file breaks a rule in it.
  groups_file: configs/activity_groups.yaml
platform:
  key_prefix: roost:planet:platform
  payment_secret: dev-platform-payment-secret
