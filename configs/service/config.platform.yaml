# Generated starter configuration; application-owned after project creation.
sid: 1000
log:
  level: info
  json: true
  stdout: true
  file: true
  dir: log
shutdown:
  total_timeout: 30s
  serve_wait_timeout: 5s
ops:
  enabled: true
  addr: 127.0.0.1:9107
  admin_enabled: false
  admin_token: ""
  allow_dev_token: false
stats_log:
  enabled: true
  dir: log
  interval: 1m
redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool_size: 32
  min_idle_conns: 4
nats:
  url: nats://127.0.0.1:4222
  prefix: roost
  worker_num: 8
  reliable:
    enabled: false
platform:
  key_prefix: roost:planet:platform
  session_secret: dev-platform-session-secret
  payment_secret: dev-platform-payment-secret
  session_ttl: 30m
  delivery_attempts: 8
