name: quest
summary: 每日任务：按业务日惰性清零的任务进度，服务端推进，领奖经货币模块在同一笔事务里发放
requires: [wallet]
conflicts: []
needs:
  mods: [nest]
  features: [protocol, entity, dao, errcode]
entity: Player
state:
  - field: Quest
    type: QuestState
    store: quest
    dao: persist,sync
    comment: Quest 是每日任务模块给玩家本人看的当日记录（所属业务日、各任务进度、已领奖的任务）；Day 不是当前业务日时整份记录已过期。
component: Quest
protocols: [QuestClaim]
errcodes: [quest_unknown, quest_incomplete, quest_claimed, quest_count_invalid]
verify:
  packages: [./game/handler, ./game/entities/player]
  run: ^TestQuest
  pass: 18
with:
  checkin:
    summary: 签到成功时把每日任务“签到一次”推进一次，与签到同一笔事务
    verify:
      packages: [./game/handler]
      run: ^TestWithQuestCheckin
      pass: 3
