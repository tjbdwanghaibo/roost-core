name: cellworld
summary: 固定 Cell 分区的正式生命周期、共享授权与出生目录、NATS 接入、关闭排空；自带玩家在格上的 SceneActor 实体与状态映射，业务 Entity 通过 CellWorld 接口接入
needs:
  mods: [nest, redis, nats, manager]
  features: [entity, dao]
entities: [SceneActor]
entity: Player
state:
  - {field: CellworldBase, type: CellworldBaseState, store: cellworld_base, dao: 'nosync', comment: 分区场景里 Player 作为 Base 跨重启要保住的恢复快照与死亡回执（cellworldhost 读写）。}
managers: [NewCellWorldHost]
verify:
  packages: [./game/modules/cellworldhost, ./game/managers]
  run: ^TestCellworld
  pass: 17
next:
  - 在服务 InstallNestHandlers 中登记 cellworld.NewHandlers()，NewNode 时传同一份 Handlers。
  - 用 game/modules/cellworldhost.New 装配 Node，CreateActor 对玩家建模块自带的 SceneActor（Param 为 cellworldhost.CellMode）；Start 之前 cellworldhost.Install(node, 场景 ID, 心跳驱动)。
  - Player 实现 BasePlayer：PlayerDao 按 cellworld README 的字段表声明 Cell* / Saved* 字段，BaseState / SetBaseState 调 cellworldhost.ReadBase / WriteBase，Base 心跳用 RegisterBaseBeat；场景实现 RegionHost。
  - 完成实体心跳装配后调用 Runtime.Start（它把 Node 交给 cellworld manager 发布的 Host，安装器已在 game/managers/managers.go 登记 NewCellWorldHost()）；停机先停自身业务准入，再调用 Runtime.Stop；它返回错误时直接从 Service.Shutdown 返回，不要先关 Nest、Redis 与 NATS（manager 停时再排空一次）。
  - Cell 进程必须开启 singleton.enabled；Redis 必须持久化且禁止淘汰权威键。完整可运行适配见 game-demo 的 game/entities/player/cell_base.go 与 internal/service/game/partition.go。
