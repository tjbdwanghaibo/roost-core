name: team
summary: 共享权威队伍：建队、邀请、入队、离队与队长交接；队伍和玩家引用同事务
needs:
  mods: [nest, remote_entity]
  features: [protocol, entity, dao, errcode]
access:
  transport: tcp
entities: [Team]
entity: Player
component: Team
state:
  - field: Team
    type: TeamState
    store: team
    dao: persist
    comment: 组队引用；权威成员表在 Remote Team 上
protocols: [TeamCreate, TeamInvite, TeamAccept, TeamLeave, TeamDisband, TeamInfo, TeamInvites, TeamInvited]
errcodes: [team_invalid, team_missing, team_exists, team_not_leader, team_not_invited, team_full, team_invites_full, team_blocked]
verify:
  packages: [./game/handler, ./game/controllers/team]
  run: ^TestTeam
  pass: 35
with:
  rehome:
    summary: 在队伍中不能换服，换服意图未清除前不能建队或入队
    verify:
      packages: [./game/handler]
      run: ^TestWithTeamRehome
      pass: 2
