name: cellspace
summary: 可选分区区域实体、玩家意图端点和唯一 Base 心跳宿主；完整启动接线见 cellworld 配方
requires: [cellworld]
needs:
  mods: [nest, heartbeat]
  features: [entity, dao, protocol]
entities: [CellRegion]
entity: Player
component: Cellspace
component_package: game/components/cellspace
protocols: [CellMove]
errcodes: [cellspace_disabled, cellspace_not_entered, cellspace_invalid_velocity, cellspace_stale_session]
verify:
  packages: [./game/modules/cellspace]
  run: ^TestCellspace
  pass: 5
