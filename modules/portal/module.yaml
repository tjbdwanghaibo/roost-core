name: portal
summary: 登录入口（manifest）：四个 HTTP 端点，挂在托管的 account 服务进程上，代客户端调 account——渠道登录拿账号票据、凭票据拿服务与区服清单与推荐（每个服的地址 / 负载 / 本账号有没有角色，可按服务筛选）、选定一个服换进服票据与该连的地址、凭票据换某个游戏的游戏账号 token（开房间类游戏的大厅凭它认人；登录时带 game 也一并给）；票据全部由 account 签发与校验，入口不持有密钥、不建角不选角；区服地址来自可替换的目录（缺省：静态配置 portal.servers 叠上 account 的带过期区服入口登记表，game 经总线定期上报、停报到期自动消失）；只依赖 account 这一侧（account_auth），不带 game 的工程（-template lobby）也能装：那里区服清单为空、/portal/enter 带 account 的 server_invalid 拒绝，登录带 game 与 /portal/game-token 照常给游戏账号 token
requires: [account_auth]
conflicts: []
needs:
  mods: [web]
  features: [errcode]
runtime:
  package: services/account/portal
  start: Start
  framework: account
config:
  package: services/account/portal
  type: Config
errcodes: [portal_request_invalid]
next:
  - "登录入口随托管 account 的进程监听 web.addr（configs/service/config.account.yaml；开发端口 8080 + services.account.port_block，按声明先后分配）：POST /portal/login、/portal/servers、/portal/enter、/portal/game-token；请求与响应见 roost-core 的 modules/portal/README.md"
  - "不带 game 的开房间工程（-template lobby）：客户端 POST /portal/login 带 game（或 /portal/game-token）拿 gt2，再以 Authorization: Bearer <gt2> 调大厅；/portal/servers 与 /portal/enter 在这种工程里没有区服可给"
  - "区服地址：game 配置写 login.presence.addr（客户端连得到的 host:port，通常是 Gate），game 定期报给 account、停报 30 秒后消失；或在 config.account.yaml 写静态的 portal.servers（服号 -> host:port），两者都有时上报的优先。都不写时清单照常列出、没有地址；别的来源改 services/account/portal/portal_rules.go 的 newDirectory"
  - "推荐规则（导量）在 services/account/portal/portal_rules.go 的 recommend：缺省老号推荐最近登录的有角色的服，新号推荐最新开的开放服"
  - "上线前：入口没有限流，凭据与票据明文在请求体里——对外要放在终止 TLS、带限流的反向代理后面，并在生产配置里显式写 web.allow_public_addr"
verify:
  packages: [./services/account/portal]
  run: ^TestPortal
  pass: 15
with:
  login:
    summary: 入口给的握手票据（EnterTicketPrefix 加进服票据）交给登录模块真实的认证器核对：认得出、映射与承载服 / 原服与 account 一致、不带前缀不认；入口为了不带 game 也能装而没有 import 登录模块，这里守住两边各写一份的前缀约定；只有测试，不加运行时代码
    verify:
      packages: [./services/account/portal]
      run: ^TestWithPortalLogin
      pass: 1
  enter:
    requires: [login]
    summary: 整条链路的场景：HTTP 登录 → 清单与推荐 → 进服票据 → 握手（登录模块的认证器，account 按账号解析或新建玩家号）→ 游戏服告知要不要先新建 → 新建（角色名在游戏服）→ 进入游戏，以及入口给的地址与进入时认的是同一个承载服；只有测试，不加运行时代码
    verify:
      packages: [./services/account/portal]
      run: ^TestWithPortalEnter
      pass: 2
