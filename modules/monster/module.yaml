name: monster
summary: 场景怪物：共享actor移动、AI巡逻与感知追击、生命代际、死亡隐藏与同ID延迟重生；出生与销毁走正式实体管理
requires: [actor, scene]
needs:
  mods: [nest, heartbeat]
  features: [entity, dao, protocol, errcode]
entity: Monster
entities: [Monster]
component: MonsterActor
protocols: [MonsterInspect]
errcodes: [monster_invalid, monster_gone, monster_not_here]
runtime: {package: game/monster/service, start: Start}
verify:
  packages: [./game/monster/service]
  run: ^TestMonster
  pass: 26
