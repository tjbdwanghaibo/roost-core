name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deep-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go test -race -coverprofile=coverage.out ./...
      # 合仓之后生成器在 codegen/ 下；P5 只改了 ./cmd/roost，漏了这三条
      # （整体检查时发现，见 ci_paths_test.go 只守 ci.yml 这一个文件）。
      - run: go test ./codegen/internal/roost -run '^$' -fuzz '^FuzzValidModulePath$' -fuzztime=30s
      - run: go test ./codegen/internal/roost -run '^$' -fuzz '^FuzzManifestDecode$' -fuzztime=30s
      - run: go test ./codegen/internal/roost -run '^$' -bench '^BenchmarkRenderProject$' -benchmem -count=5 > benchmark.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-quality-${{ github.run_id }}
          path: |
            coverage.out
            benchmark.txt
          if-no-files-found: error
          retention-days: 30
