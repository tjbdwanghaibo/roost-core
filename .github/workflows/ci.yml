name: ci

on:
  push:
    branches: [main, master, consolidation-v3]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go run ./cmd/glsvet ./...
        # integration-tagged tests (redis toxiproxy suites) are excluded from
        # `go test ./...`; vetting them keeps the build-tagged files compiling.
      - run: go vet -tags integration ./...
      - run: go test -run '^$' -bench BenchmarkRemoteSnapshotCacheL1Get4K -benchtime=1s ./framework/entity
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # RR-20260921-05: what this repository generates, and the guards that run
  # what the generator emits, are checked here and nowhere else.
  #
  # The //go:generate outputs under kit/service and service/ are committed; a
  # stale or hand-edited *_gen.go builds, vets and tests green, and only
  # regenerating shows it (`generate --check` runs in generated projects, not
  # here). `git status --porcelain` also catches an output nobody committed.
  #
  # The codegen runtime guards compile the generators' output against the
  # roost-core release the generator promises as its minimum
  # (codegen/scripts/core-pin.sh) and run it: codegen's own tests only compare
  # text. They exited 2 from the consolidation to 10-04 and no workflow ran
  # them. ci_generated_code_test.go pins both halves of this job.
  generated-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go generate leaves the tree unchanged
        run: |
          go generate ./...
          dirty=$(git status --porcelain)
          if [ -n "$dirty" ]; then
            echo "::error::go generate ./... changed the tree: run it and commit the result"
            echo "$dirty"
            git --no-pager diff
            exit 1
          fi
      - name: dao goldens against roost-core (U-0224, RR-20260917-05)
        run: sh codegen/scripts/dao-golden-runtime.sh
      - name: attribute scaffold and generator against roost-core (RR-20260917-06)
        run: sh codegen/scripts/attribute-runtime.sh
      - name: sync=true entity against roost-core (RR-20260918-01)
        run: sh codegen/scripts/entity-sync-runtime.sh
      - name: cfggen output against roost-core configdata
        run: sh codegen/scripts/cfggen-golden-runtime.sh
      - name: tablegen output against roost-core configdata (RR-20261005-NC-75)
        run: sh codegen/scripts/tablegen-runtime.sh

  # The test suite runs in shards because the single job that used to run it
  # will not hold the merged module: kit and codegen are about to move in
  # (ARCHITECTURE_V3_SINGLE_MODULE_PLAN P1) and Core's test time roughly
  # doubles.
  #
  # The shards are computed from `go list`, not written down. A hand-kept list
  # of package groups is a second place to remember every new package, and it
  # drifts silently the first time somebody forgets — the C4 shape this
  # repository has been bitten by often enough. Modulo over the listing gives a
  # disjoint cover of every package by construction.
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: shard ${{ matrix.shard }} of 4
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          packages=$(go list ./... | awk -v shard="$SHARD" 'NR % 4 == shard')
          if [ -z "$packages" ]; then
            echo "shard $SHARD covers no packages"
            exit 0
          fi
          echo "$packages"
          # shellcheck disable=SC2086
          go test $packages
          # shellcheck disable=SC2086
          go test -race $packages

  # The game services keep their Redis-backed suites build-tagged; they skip
  # without REDIS_ADDR, so this job sets it, runs them and fails on a skip.
  # -p 1: the suites share one Redis and service/integration measures the
  # whole keyspace before/after.
  #
  # Both halves of a service are listed: the assembly half under kit/service
  # AND the transport half under service/ (mail's Redis suite moved there with
  # the M-11 split and was run by nobody for two weeks — the skip guard below
  # can only see packages this job actually ran; RR-20260922-03).
  # kit/redis carries the App singleton lock's Redis store suite (same REDIS_ADDR gate).
  # integration_coverage_promises_test.go pins the list to the files on disk.
  service-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      REDIS_ADDR: 127.0.0.1:6379
      # RR-20261001-01：09-29 的 service 修复把 Redis 变体挂在另外四个变量上；只设
      # REDIS_ADDR 时它们静默 SKIP 或落回 Memory 替身，这个 job 等于没跑它们。
      # integration_coverage_promises_test.go 把这组名字钉在测试文件里的 os.Getenv 上。
      ROOST_REDIS_TEST_ADDR: 127.0.0.1:6379
      ROOST_REVIEW_REDIS: 127.0.0.1:6379
      ROOST_REVIEW3_BACKEND: redis
      ROOST_REVIEW4_BACKEND: redis
      ROOST_BUGFIX5_BACKEND: redis
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: integration-tagged service tests on Redis
        run: |
          set -o pipefail
          go test -tags integration -count=1 -p 1 -json ./wiring/redis/ ./wiring/... ./service/... | tee test.json \
            | jq -r 'select(.Test==null and (.Action=="pass" or .Action=="fail")) | .Action + "\t" + .Package'
      - name: failing test output (on failure)
        if: failure()
        run: jq -r 'select(.Action=="output") | .Output' test.json | grep -vE '^(=== RUN|--- PASS|PASS|ok )' | tail -200
      - name: no Redis test was skipped
        run: |
          skipped=$(jq -r 'select(.Action=="output" and (.Output|test("REDIS_ADDR|ROOST_REVIEW_REDIS|ROOST_REDIS_TEST_ADDR|ROOST_[A-Z0-9]*_BACKEND"))) | .Package + " " + .Test' test.json | sort -u)
          if [ -n "$skipped" ]; then
            echo "these tests skipped because a Redis gate variable was unset — the job must run them:"
            echo "$skipped"
            exit 1
          fi
      - name: race on the Redis-backed service suites
        run: go test -tags integration -count=1 -p 1 -race ./wiring/integration/ ./wiring/mail/ ./wiring/rank/ ./service/mail/

  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: root module has no local replace
        run: |
          if grep -Eq '^[[:space:]]*replace([[:space:]]|\()' go.mod; then
            echo "release module must not contain replace directives"
            grep -nE '^[[:space:]]*replace([[:space:]]|\()' go.mod
            exit 1
          fi
      # The module path must resolve as a real repository, and a version tag
      # must match the module's major suffix — the two failure modes that made
      # v1.4.0-era roost-skill uninstallable (module pointed at a nonexistent
      # repo, and a v1 tag on a /v2 module path).
      - name: module path resolves
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          base=$(echo "$mod" | sed -E 's#/v[0-9]+$##')
          echo "module: $mod (repo: $base)"
          git ls-remote "https://${base}.git" HEAD
      - name: tag matches module major
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          tag=${GITHUB_REF#refs/tags/}
          major=$(echo "$tag" | sed -E 's#^v([0-9]+)\..*#\1#')
          suffix=$(echo "$mod" | grep -oE '/v[0-9]+$' | tr -d '/v' || true)
          if [ "$major" -ge 2 ]; then want="$major"; else want=""; fi
          if [ "${suffix:-}" != "${want}" ]; then
            echo "tag $tag requires module suffix '/v${want}' but go.mod has '${suffix:+/v$suffix}'"
            exit 1
          fi
