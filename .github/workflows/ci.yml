name: ci

on:
  push:
    branches: [main, master, consolidation-v3]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  linux-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go run ./cmd/glsvet ./...
        # integration-tagged tests (redis toxiproxy suites) are excluded from
        # `go test ./...`; vetting them keeps the build-tagged files compiling.
      - run: go vet -tags integration ./...
      - run: go test -run '^$' -bench BenchmarkRemoteSnapshotCacheL1Get4K -benchtime=1s ./entity
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  # The test suite runs in shards because the single job that used to run it
  # will not hold the merged module: kit and codegen are about to move in
  # (ARCHITECTURE_V3_SINGLE_MODULE_PLAN P1) and Core's test time roughly
  # doubles.
  #
  # The shards are computed from `go list`, not written down. A hand-kept list
  # of package groups is a second place to remember every new package, and it
  # drifts silently the first time somebody forgets — the C4 shape this
  # repository has been bitten by often enough. Modulo over the listing gives a
  # disjoint cover of every package by construction.
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: shard ${{ matrix.shard }} of 4
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          packages=$(go list ./... | awk -v shard="$SHARD" 'NR % 4 == shard')
          if [ -z "$packages" ]; then
            echo "shard $SHARD covers no packages"
            exit 0
          fi
          echo "$packages"
          # shellcheck disable=SC2086
          go test $packages
          # shellcheck disable=SC2086
          go test -race $packages

  # The game services (kit/service) keep their Redis-backed suites build-tagged;
  # they skip without REDIS_ADDR, so this job sets it, runs them and fails on a
  # skip. -p 1: the suites share one Redis and service/integration measures the
  # whole keyspace before/after.
  service-redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: integration-tagged service tests on Redis
        run: |
          set -o pipefail
          go test -tags integration -count=1 -p 1 -json ./kit/service/... | tee test.json \
            | jq -r 'select(.Test==null and (.Action=="pass" or .Action=="fail")) | .Action + "\t" + .Package'
      - name: failing test output (on failure)
        if: failure()
        run: jq -r 'select(.Action=="output") | .Output' test.json | grep -vE '^(=== RUN|--- PASS|PASS|ok )' | tail -200
      - name: no Redis test was skipped
        run: |
          skipped=$(jq -r 'select(.Action=="output" and (.Output|test("REDIS_ADDR"))) | .Package + " " + .Test' test.json | sort -u)
          if [ -n "$skipped" ]; then
            echo "these tests skipped because REDIS_ADDR was unset — the job must run them:"
            echo "$skipped"
            exit 1
          fi
      - name: race on the Redis-backed service suites
        run: go test -tags integration -count=1 -p 1 -race ./kit/service/integration/ ./kit/service/mail/ ./kit/service/rank/

  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: root module has no local replace
        run: |
          if grep -Eq '^[[:space:]]*replace([[:space:]]|\()' go.mod; then
            echo "release module must not contain replace directives"
            grep -nE '^[[:space:]]*replace([[:space:]]|\()' go.mod
            exit 1
          fi
      # The module path must resolve as a real repository, and a version tag
      # must match the module's major suffix — the two failure modes that made
      # v1.4.0-era roost-skill uninstallable (module pointed at a nonexistent
      # repo, and a v1 tag on a /v2 module path).
      - name: module path resolves
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          base=$(echo "$mod" | sed -E 's#/v[0-9]+$##')
          echo "module: $mod (repo: $base)"
          git ls-remote "https://${base}.git" HEAD
      - name: tag matches module major
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mod=$(head -1 go.mod | awk '{print $2}')
          tag=${GITHUB_REF#refs/tags/}
          major=$(echo "$tag" | sed -E 's#^v([0-9]+)\..*#\1#')
          suffix=$(echo "$mod" | grep -oE '/v[0-9]+$' | tr -d '/v' || true)
          if [ "$major" -ge 2 ]; then want="$major"; else want=""; fi
          if [ "${suffix:-}" != "${want}" ]; then
            echo "tag $tag requires module suffix '/v${want}' but go.mod has '${suffix:+/v$suffix}'"
            exit 1
          fi
