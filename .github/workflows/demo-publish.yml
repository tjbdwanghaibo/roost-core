# ⚠️ 只保留手动触发：这条流水线**在合仓之前就没有成功过**（最近 30 次 0 成功）。
# 它卡在最后一步——GitHub 不允许 Actions 的 token 推送带 .github/workflows/ 的树：
#   ! [remote rejected] demo-generated -> demo-generated
#     (refusing to allow a GitHub App to create or update workflow `.github/workflows/ci.yml`
#      without `workflows` permission)
# 合仓把它前面的部分修好了（生成、编译、测试、generate --check 现在都过），
# 但"发布出去的 demo 要不要带它自己的 CI"是产品决定，不该由搬迁批次拍板。
# 登记为 W-2026-09-20-06，交给审查线。
name: demo-publish

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Generate the demo project against framework source head
        env:
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          # One module: the generator, the templates and the runtime are all in
          # this checkout, so nothing is cloned and the workspace has one member
          # besides the project (三仓合一仓 P5).
          go build -o "${RUNNER_TEMP}/roost" ./codegen/cmd/roost
          "${RUNNER_TEMP}/roost" project new planet -skip-deps -module example.com/planet -out "${RUNNER_TEMP}/planet" \
            -mods configdata,mongo,nats,dataengine,nest -template game-demo
          cd "${RUNNER_TEMP}/planet"
          cat > go.work <<W
          go 1.27.0

          use (
          	.
          	${GITHUB_WORKSPACE}
          )
          W
          # -mod=mod (set for generation, above) is rejected in workspace mode.
          export GOFLAGS=
          # The generated go.mod names the release this tree belongs to, which
          # the proxy and the checksum database may not have indexed yet right
          # after a tag is pushed. The workspace is what supplies the framework
          # here, so the requirement goes before anything resolves.
          go mod edit -droprequire=github.com/tjbdwanghaibo/roost-core
          go build ./...
          go vet ./...
          go test ./...
          "${RUNNER_TEMP}/roost" generate --check
          "${RUNNER_TEMP}/roost" id check
          rm -f go.work go.work.sum
      - name: Push the generated tree to demo-generated
        run: |
          set -euo pipefail
          SRC_SHA="$(git rev-parse --short HEAD)"
          cd "${RUNNER_TEMP}/planet"
          cat > GENERATED.md <<M
          # Generated — do not edit here

          This tree is the output of \`roost project new planet -module example.com/planet -mods configdata,mongo,nats,dataengine,nest -template game-demo\`
          from roost-core ${SRC_SHA} (source head).
          It exists to be cloned and read. Changes belong in roost-core/demo (the templates) or roost-core/codegen/internal/roost (the scaffold);
          the next publish overwrites this branch.

          To build it yourself, add a go.work pointing at a roost-core checkout: the wiring HEAD emits may need its main branch.
          M
          git init -q -b demo-generated
          git config user.name "roost-core[bot]"
          git config user.email "roost-core@users.noreply.github.com"
          git add -A
          git commit -q -m "demo-generated: roost-core ${SRC_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" demo-generated:demo-generated
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
