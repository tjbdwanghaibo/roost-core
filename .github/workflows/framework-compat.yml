# 生成物兼容矩阵。三仓合一仓之后只剩一个框架模块，所以：
#   * source-head：工作区指向本 checkout（不再 clone 第二个仓）；
#   * minimum / released：v1.16.0 发布之后恢复。它们要求**已发布**的框架能编译
#     当前生成器的产物——合仓当天这不成立（产物的 import 只在未发布的版本里），
#     现在成立了。下面 version_args 那行仍是生成器下限的唯一副本，
#     deploy_hygiene_test 逐字比对它。
name: framework-compat

on:
  push:
    branches: [main, master, consolidation-v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: framework-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  generated-consumer:
    strategy:
      fail-fast: false
      matrix:
        dependency-set: [minimum, released, source-head]
        scenario: [minimal, full, demo]
        consumer-go: ["1.27.x"]
        # 合仓前这里有一条 exclude：demo 场景与 minimum 组合不成立，因为
        # minimum 故意钉比 demo 模板所需更老的 tag。现在下限就是合仓那个版本，
        # 它当然带着 demo 需要的一切，所以这条 exclude 没有了。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: build current generator
        run: go build -o "${RUNNER_TEMP}/roost" ./codegen/cmd/roost
      - name: generate scenario
        env:
          SET: ${{ matrix.dependency-set }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          version_args=()
          if [ "$SET" = minimum ]; then
            version_args=(-roost-core-version v1.16.0 -roost-kit-version v1.14.8 -codegen-version v1.15.0)
          fi
          mods=configdata
          services=game
          template_args=()
          if [ "$SCENARIO" = demo ]; then
            # game-demo is the whole point of this cell: the template performs
            # its own add sequence (components, DAO, handler, access,
            # transport, protocol, endpoint) and ships the bodies, so the
            # scenario only generates and compiles. A template whose output
            # stops building fails here rather than in someone's first hour.
            mods=configdata,mongo,nats,dataengine,nest
            template_args=(-template game-demo)
          fi
          if [ "$SCENARIO" = full ]; then
            mods=configdata,etcd,redis,mongo,nats,sync,remote_entity,dataengine,nest,saga
            services=game,gate
            # The game template hosts account / mail / match / chat and wires
            # game to them, so the full scenario compiles kit/service too.
            template_args=(-template game)
          fi
          # 只有 source-head 要 --skip-deps：它编译的是 checkout，产物的 import
          # 可能还没进任何发布。minimum / released 要的恰恰相反——让依赖真的
          # 从 proxy 解析出来。
          skip_args=()
          if [ "$SET" = source-head ]; then skip_args=(-skip-deps); fi
          "${RUNNER_TEMP}/roost" project new planet "${skip_args[@]}" -module example.com/planet -out "${RUNNER_TEMP}/planet" -mods "$mods" -services "$services" "${version_args[@]}" "${template_args[@]}"
          if [ "$SCENARIO" = full ]; then
            cd "${RUNNER_TEMP}/planet"
            "${RUNNER_TEMP}/roost" add access player --service gate
            "${RUNNER_TEMP}/roost" add transport tcp
            # Player and its lifecycle come from -template game; the scenario
            # builds on them rather than adding them a second time.
            "${RUNNER_TEMP}/roost" add component Profile --entity Player
            "${RUNNER_TEMP}/roost" add dao Player --entity Player
            "${RUNNER_TEMP}/roost" add handler RenamePlayer --entity Player --component Profile
            "${RUNNER_TEMP}/roost" add protocol RenamePlayer --group game --handler player
            "${RUNNER_TEMP}/roost" add endpoint RenamePlayer --handler player
            "${RUNNER_TEMP}/roost" add skill Fireball
            "${RUNNER_TEMP}/roost" add saga GuildTransfer -service game -steps debit,credit
            # A project-owned rpc: game owns it, gate calls it (uses_rpcs is a
            # manifest edit, so it goes through sync).
            "${RUNNER_TEMP}/roost" add rpc Guild -service game
            sed -i 's/^    gate:$/    gate:\n        uses_rpcs:\n            - guild/' roost.yaml
            "${RUNNER_TEMP}/roost" project sync "${skip_args[@]}"
            # Pure-version scenarios exercise the transactional generate+tidy
            # path here. Source-head is compiled through go.work below because
            # its APIs may intentionally not exist in the latest tag yet.
            if [ "$SET" != source-head ]; then
              "${RUNNER_TEMP}/roost" generate
            fi
          fi
      - name: use current framework source through a temporary workspace
        if: matrix.dependency-set == 'source-head'
        working-directory: ${{ runner.temp }}/planet
        run: |
          # One module: the workspace points at this checkout, and there is no
          # second repository to clone (三仓合一仓 P4).
          cd "${RUNNER_TEMP}"
          go work init ./planet "$GITHUB_WORKSPACE"
          # The generated go.mod pins the generator's floor, which during a
          # boundary migration nobody has published yet; `go get` resolves the
          # whole graph and would fail on it, and the workspace is what supplies
          # the framework anyway — so that requirement goes first.
          #
          # `project new --skip-deps` skipped `go mod tidy`, and tidy is what
          # normally upgrades the pre-split google.golang.org/genproto that
          # etcd's old requirement drags in. Left alone, the monolith and the
          # split googleapis/{api,rpc} modules both provide the same package
          # and every build fails with "ambiguous import". The workspace cannot
          # resolve it (tidy ignores go.work), so do that one piece of tidy's
          # work explicitly — it needs no unpublished release.
          (cd planet && go mod edit -droprequire=github.com/tjbdwanghaibo/roost-core && GOFLAGS=-mod=mod go get google.golang.org/genproto@latest)
          # The workspace go directive must be at least every member's own.
          # It used to be pinned DOWN to 1.25.0, because the framework runtime
          # modules supported a lower consumer lane than codegen did. They no
          # longer do: core and kit are go 1.27.0, so pinning the workspace
          # below that fails outright rather than exercising an older lane.
          # Codegen itself is already built and is intentionally not a member.
          go work edit -go=1.27.0
      - name: select generated-project Go compatibility version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.consumer-go }}
          cache-dependency-path: ${{ runner.temp }}/planet/go.sum
      - name: compile generated consumer and check idempotence
        working-directory: ${{ runner.temp }}/planet
        env:
          SET: ${{ matrix.dependency-set }}
        run: |
          if [ "$SET" = source-head ]; then
            go test ./...
            go vet ./...
            go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          else
            GOWORK=off go mod tidy
            GOWORK=off go mod verify
            "${RUNNER_TEMP}/roost" generate --check
            GOWORK=off go test ./...
            GOWORK=off go vet ./...
            GOWORK=off go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          fi
          for script in deploy/shell/*.sh deploy/docker/*.sh deploy/k8s/*.sh; do sh -n "$script"; done
          ROOST_IMAGE=ghcr.io/example/planet@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa ROOST_CONFIG_ROOT="$PWD/configs/service" docker compose -f deploy/docker/docker-compose.prod.yaml config --quiet
          kubectl kustomize deploy/k8s/overlays/staging >/dev/null
      - name: source workspace remains temporary and modules stay publishable
        if: matrix.dependency-set == 'source-head'
        working-directory: ${{ runner.temp }}/planet
        run: |
          test ! -e go.work
          if grep -qE '^[[:space:]]*replace[[:space:](]' go.mod; then echo "consumer go.mod has a replace directive"; exit 1; fi
      # The assembly gate. Three defects that every unit test and every
      # hand-wired integration test missed were found only by starting a
      # generated project for real: a ClientMod depending on the capability
      # name "bus", kit Mods depending on "health" / "nats.jetstream", and a
      # lifecycle file redeclaring FromRegistry. This step starts the
      # generated processes on the project's own dev compose stack and
      # requires each to reach `service init` and stay up.
      - name: boot the generated processes on the dev compose stack
        if: matrix.scenario == 'full'
        working-directory: ${{ runner.temp }}/planet
        env:
          SET: ${{ matrix.dependency-set }}
        run: |
          set -euo pipefail
          if [ "$SET" != source-head ]; then export GOWORK=off; fi
          docker compose -f deploy/dev/docker-compose.yaml up -d
          for _ in $(seq 1 45); do
            if docker compose -f deploy/dev/docker-compose.yaml exec -T mongo mongosh --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q '^1$'; then break; fi
            sleep 2
          done
          docker compose -f deploy/dev/docker-compose.yaml exec -T mongo mongosh --quiet --eval 'rs.status().ok' | grep -q '^1$'
          go build -o ./planet .
          boot() {
            local svc="$1" pid
            ./planet "$svc" --config "configs/service/config.$svc.yaml" >"$svc.boot.log" 2>&1 &
            pid=$!
            for _ in $(seq 1 90); do
              if grep -q '"msg":"service init"' "$svc.boot.log"; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            sleep 3
            if ! grep -q '"msg":"service init"' "$svc.boot.log" || ! kill -0 "$pid" 2>/dev/null; then
              echo "::error::generated $svc process did not reach service init and stay up"
              tail -n 40 "$svc.boot.log"
              exit 1
            fi
            echo "$svc: service init reached, process alive"
            kill "$pid"
            wait "$pid" 2>/dev/null || true
          }
          boot mail
          boot game
      # The demo gate. The compile cell proves the template's output builds;
      # this proves it works: the six generated processes (account, chat,
      # mail, match, session, game) come up on the project's own dev compose
      # stack through the generated deploy/dev/run.sh, and six robots go
      # through the whole chain — login, chat, items, exp, reward-mail claim,
      # dungeon, duel and ranked matchmaking — with thresholds. What a user's
      # first `make dev-run && make dev-smoke` does, done here first.
      - name: run the demo's robots against the dev compose stack
        if: matrix.scenario == 'demo'
        working-directory: ${{ runner.temp }}/planet
        env:
          SET: ${{ matrix.dependency-set }}
        run: |
          set -euo pipefail
          if [ "$SET" != source-head ]; then export GOWORK=off; fi
          docker compose -f deploy/dev/docker-compose.yaml up -d
          for _ in $(seq 1 45); do
            if docker compose -f deploy/dev/docker-compose.yaml exec -T mongo mongosh --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q '^1$'; then break; fi
            sleep 2
          done
          docker compose -f deploy/dev/docker-compose.yaml exec -T mongo mongosh --quiet --eval 'rs.status().ok' | grep -q '^1$'
          READY_TIMEOUT=180 sh deploy/dev/run.sh start
          go run ./cmd/loadtest -count 6
          sh deploy/dev/run.sh stop
      - name: dev stack state (on failure)
        if: failure() && (matrix.scenario == 'full' || matrix.scenario == 'demo')
        working-directory: ${{ runner.temp }}/planet
        run: |
          docker compose -f deploy/dev/docker-compose.yaml ps || true
          docker compose -f deploy/dev/docker-compose.yaml logs --tail=60 || true
          for log in *.boot.log .dev/*.log; do [ -f "$log" ] || continue; echo "== $log"; tail -n 80 "$log"; done 2>/dev/null || true
          sh deploy/dev/run.sh stop 2>/dev/null || true
      - name: tear down the dev stack
        if: always() && (matrix.scenario == 'full' || matrix.scenario == 'demo')
        working-directory: ${{ runner.temp }}/planet
        run: docker compose -f deploy/dev/docker-compose.yaml down -v || true
