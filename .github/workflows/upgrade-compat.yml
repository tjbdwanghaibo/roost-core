# 已发布工程的升级矩阵：用**已发布**的 roost-core 里的生成器生成工程，再用当前生成器升级它。
# 当前生成器的产出可能需要尚未发布的 core，所以升级后加一个指向本 checkout 的 go.work 再编译——
# 这条门禁证明的是：上一个发布版生成的工程能被当前生成器升级、不改业务文件，并且编译得起来。
# 合仓前的工程（roost-codegen / roost-kit / roost-skill / roost-service 时代）不再支持升级：
# 三仓迁移工具 upgrade --consolidate 已删除（线上尚未部署，不做旧工程兼容）。
name: upgrade-compat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: upgrade-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  previous-project:
    strategy:
      fail-fast: false
      matrix:
        # Generators that ship inside roost-core with the current package
        # layout (framework/ infra/ wiring/ …). Older releases need the
        # retired import rewrite and cannot be upgraded any more.
        core: [v1.25.0]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "${RUNNER_TEMP}/roost-current" ./codegen/cmd/roost
      - name: create historical project
        run: GOWORK=off go run github.com/tjbdwanghaibo/roost-core/codegen/cmd/roost@${{ matrix.core }} project new planet -module example.com/planet -out "${RUNNER_TEMP}/planet" -mods configdata
      - name: upgrade without overwriting business files
        working-directory: ${{ runner.temp }}/planet
        run: |
          sha256sum internal/service/game/service.go > "${RUNNER_TEMP}/business.before"
          # The hand edits the v1.26.0 upgrade notes (CHANGELOG "升级要求速查",
          # v1.26.0-NOTES U4/U6) require before upgrading a project generated
          # by v1.25.0: versions.kit is retired and refused; the never-wired
          # entity event chain is deleted, so the `event` feature is refused as
          # unknown and its leftovers (framework/event/, *_event_gen.go) go too.
          # The default v1.25.0 project has no other retired spelling (no
          # sync/room/replication-* names, no //cube:, no v1 _manifest.json).
          sed -i '/^    kit: /d' roost.yaml
          sed -i '/^    - event$/d' roost.yaml
          rm -rf framework/event
          find . -name '*_event_gen.go' -delete
          if grep -nE '^    (kit: |- event$)' roost.yaml; then
            echo "::error::roost.yaml still carries a retired entry after the documented hand edits"
            exit 1
          fi
          core=latest
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --dry-run -core "$core"
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --skip-deps -core "$core"
          sha256sum -c "${RUNNER_TEMP}/business.before"
          # The upgraded templates may need APIs of this checkout that no
          # published core has yet: compile against the checkout.
          go work init . "$GITHUB_WORKSPACE"
          go work edit -go=1.27.0
          "${RUNNER_TEMP}/roost-current" project diff
          # GOWORK stays ON from here: the point is to compile against the
          # checkout. `go mod tidy` is skipped for the same reason — it ignores
          # the workspace and would try to resolve the unpublished boundary.
          go build ./...
          go test ./...
          go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          cp roost.yaml "${RUNNER_TEMP}/roost.before"
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --skip-deps -core "$core"
          cmp roost.yaml "${RUNNER_TEMP}/roost.before"
