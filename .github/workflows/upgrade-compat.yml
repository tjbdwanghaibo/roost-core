# 历史工程的升级矩阵：用**已发布**的老 codegen 生成工程，再用当前生成器升级它。
# 三仓合一仓之后当前生成器的产出需要尚未发布的 core，所以改写完之后加一个指向
# 本 checkout 的 go.work 再编译——这正是这条门禁要证明的事：老工程能被改写到
# 新布局并且编译得起来（三仓合一仓 P4）。
name: upgrade-compat

on:
  push:
    branches: [main, master, consolidation-v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: upgrade-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  previous-project:
    strategy:
      fail-fast: false
      matrix:
        # v1.11.0 is the first generator that emits github.com/tjbdwanghaibo/roost-*
        # requirements; older ones wrote the pre-rename cube-* paths, which
        # `go get` can no longer resolve, so their projects cannot be created.
        codegen: [v1.11.0, v1.12.1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "${RUNNER_TEMP}/roost-current" ./codegen/cmd/roost
      - name: create historical project
        run: go run github.com/tjbdwanghaibo/roost-codegen/cmd/roost@${{ matrix.codegen }} project new planet -module example.com/planet -out "${RUNNER_TEMP}/planet" -mods configdata
      - name: upgrade without overwriting business files
        working-directory: ${{ runner.temp }}/planet
        run: |
          sha256sum internal/service/game/service.go > "${RUNNER_TEMP}/business.before"
          # Historical projects predate the consolidation: the first upgrade
          # must rewrite their imports (--consolidate) before the version bump.
          core=latest; kit=latest
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --consolidate --dry-run -core "$core" -kit "$kit" -codegen latest
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --consolidate --skip-deps -core "$core" -kit "$kit" -codegen latest
          sha256sum -c "${RUNNER_TEMP}/business.before"
          if grep -qE 'roost-skill|roost-service|roost-kit|roost-codegen' go.mod; then echo "go.mod still requires a folded-in module"; exit 1; fi
          # The rewritten project imports roost-core/kit/…, which exists in
          # this checkout and not yet in any published core. The workspace is
          # how a boundary migration is verified before the boundary release
          # exists; P5 drops it once core v1.16.0 is out.
          go work init . "$GITHUB_WORKSPACE"
          go work edit -go=1.27.0
          "${RUNNER_TEMP}/roost-current" project diff
          # GOWORK stays ON from here: the point is to compile against the
          # checkout. `go mod tidy` is skipped for the same reason — it ignores
          # the workspace and would try to resolve the unpublished boundary.
          go build ./...
          go test ./...
          go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          cp roost.yaml "${RUNNER_TEMP}/roost.before"
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --skip-deps -core "$core" -kit "$kit" -codegen latest
          cmp roost.yaml "${RUNNER_TEMP}/roost.before"
