# ⚠️ 三仓合一仓搬迁中（P3）：本工作流从 roost-codegen 原样搬来，内容未改——
# 它检查的东西（生成器版本下限、升级器历史、release shell 卫生）仍然由
# codegen/internal/roost/deploy_hygiene_test.go 逐条断言，所以文件不能删。
# 但它的作业还是跨仓形态（clone roost-kit、三仓 go.work、-roost-kit-version），
# 合仓之后这些步骤要重写，属于 P4（升级器）与 P5（发布）。在那之前只保留手动触发，
# 不在每次 push 上跑一个必然失败的门禁。
#   方案：docs/ARCHITECTURE_V3_SINGLE_MODULE_PLAN.zh-CN.md
name: upgrade-compat

on:
  workflow_dispatch:

concurrency:
  group: upgrade-compat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  previous-project:
    strategy:
      fail-fast: false
      matrix:
        # v1.11.0 is the first generator that emits github.com/tjbdwanghaibo/roost-*
        # requirements; older ones wrote the pre-rename cube-* paths, which
        # `go get` can no longer resolve, so their projects cannot be created.
        codegen: [v1.11.0, v1.12.1]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o "${RUNNER_TEMP}/roost-current" ./cmd/roost
      - name: create historical project
        run: go run github.com/tjbdwanghaibo/roost-codegen/cmd/roost@${{ matrix.codegen }} project new planet -module example.com/planet -out "${RUNNER_TEMP}/planet" -mods configdata
      - name: upgrade without overwriting business files
        working-directory: ${{ runner.temp }}/planet
        run: |
          sha256sum internal/service/game/service.go > "${RUNNER_TEMP}/business.before"
          # Historical projects predate the consolidation: the first upgrade
          # must rewrite their imports (--consolidate) before the version bump.
          core=latest; kit=latest
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --consolidate --dry-run -core "$core" -kit "$kit" -codegen latest
          "${RUNNER_TEMP}/roost-current" project upgrade --root . --consolidate -core "$core" -kit "$kit" -codegen latest
          sha256sum -c "${RUNNER_TEMP}/business.before"
          if grep -qE 'roost-skill|roost-service' go.mod; then echo "go.mod still requires a folded-in module"; exit 1; fi
          "${RUNNER_TEMP}/roost-current" project diff
          GOWORK=off go mod tidy
          GOWORK=off go test ./...
          GOWORK=off go run github.com/tjbdwanghaibo/roost-core/cmd/glsvet ./...
          cp roost.yaml "${RUNNER_TEMP}/roost.before"
          "${RUNNER_TEMP}/roost-current" project upgrade --root . -core "$core" -kit "$kit" -codegen latest
          cmp roost.yaml "${RUNNER_TEMP}/roost.before"
