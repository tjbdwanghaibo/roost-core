# Copy to secret.account.local.yaml, replace every CHANGE_ME, then apply it separately.
apiVersion: v1
kind: Secret
metadata:
  name: planet-account-config
  namespace: roost
type: Opaque
stringData:
  config.yaml: |
    # Generated starter configuration; application-owned after project creation.
    sid: 1000
    log:
      level: info
      json: true
      stdout: true
      file: false
      dir: log
    shutdown:
      # Whole shutdown window: Service.Shutdown, then every Mod in reverse order. Every Mod without
      # a declared stop budget keeps a fixed 3s floor; a Mod that declares one
      # (dataengine.shutdown_timeout) is granted it from the rest, scaled down with a warning only
      # when the rest cannot cover it. Generated for this service's 6 Mods: 0s declared + 3s x 6
      # undeclared + 5s for Service.Shutdown = 23s. roost sync updates this block while it is
      # unedited when the service's Mods change; roost doctor checks an edited one.
      # The deployment's termination grace period (k8s terminationGracePeriodSeconds, compose
      # stop_grace_period, systemd TimeoutStopSec, deploy/dev/run.sh) must be
      # >= total_timeout + 5s: 28s for this service.
      total_timeout: 23s
      serve_wait_timeout: 5s
    ops:
      enabled: true
      addr: 0.0.0.0:9100
      admin_enabled: false
      admin_token: ""
      allow_dev_token: false
    stats_log:
      enabled: true
      dir: log
      interval: 1m
    redis:
      addr: CHANGE_ME:6379
      password: ""
      db: 0
      pool_size: 32
      min_idle_conns: 4
    nats:
      url: nats://CHANGE_ME:4222
      prefix: roost
      worker_num: 8
      reliable:
        enabled: false
    account:
      key_prefix: roost:planet:account
      session_secret: CHANGE_ME
      session_ttl: 30m
      claim_ttl: 5m
