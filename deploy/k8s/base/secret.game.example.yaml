# Copy to secret.game.local.yaml, replace every CHANGE_ME, then apply it separately.
apiVersion: v1
kind: Secret
metadata:
  name: planet-game-config
  namespace: roost
type: Opaque
stringData:
  config.yaml: |
    # Generated starter configuration; application-owned after project creation.
    sid: 1000
    log:
      level: info
      json: true
      stdout: true
      file: false
      dir: log
    shutdown:
      total_timeout: 30s
      serve_wait_timeout: 5s
    ops:
      enabled: true
      addr: 0.0.0.0:9100
      admin_enabled: false
      admin_token: ""
      allow_dev_token: false
    stats_log:
      enabled: true
      dir: log
      interval: 1m
    config_data:
      dir: configs/data
    mongo:
      uri: mongodb://CHANGE_ME:27017/?replicaSet=rs0
      connect_timeout: 5s
      transaction_timeout: 30s
      require_replica_set: true
      max_pool_size: 100
      min_pool_size: 5
      max_idle_time: 5m
    nats:
      url: nats://CHANGE_ME:4222
      prefix: roost
      worker_num: 8
      reliable:
        enabled: false
    persistence:
      engine: dataengine
    nest:
      worker_num: 8
      heartbeat_worker_num: 2
      queue_capacity: 4096
      delayed_capacity: 4096
      max_delay: 24h
      tick_duration: 50ms
      request_timeout: 3s
      pipelined:
        allowlist: []
        async: false
        async_workers: 8
        async_queue_capacity: 4096
    dataengine:
      database: game
      startup_timeout: 30s
      shutdown_timeout: 30s
      transaction_receipt_ttl: 720h
      receipt_ttl: 720h
      wal:
        dir: /var/lib/roost/wal
        writer_version: 2
        segment_bytes: 268435456
        max_disk_bytes: 8589934592
        max_unacked_age: 24h
        queue_capacity: 8192
        group_commit_interval: 2ms
      projection:
        batch_records: 256
        retry_min: 100ms
        retry_max: 5s
      outbox:
        workers: 2
        batch_size: 64
        lease_duration: 30s
        poll_interval: 100ms
        retry_min: 1s
        retry_max: 1m
        max_pending: 1000000
        max_oldest_age: 30m
      effects:
        subject_prefix: roost.effect
        stream: ROOST_EFFECTS
        max_age: 168h
        max_bytes: 8589934592
        duplicate_window: 10m
        replicas: 3
    redis:
      addr: CHANGE_ME:6379
      password: ""
      db: 0
      pool_size: 32
      min_idle_conns: 4
    syncbus:
      transport: jetstream
      prefix: roost.sync
      storage: file
      replicas: 3
      publish_timeout: 3s
    remote_entity:
      lock_ttl: 15s
      retry_count: 3
      retry_delay: 100ms
      op_timeout: 3s
      unlock_retry_count: 5
      unlock_retry_interval: 100ms
      version_ttl: 24h
      finalize_retry_interval: 500ms
      max_write_batch: 64
      wrapper_capacity: 65536
      wrapper_idle_ttl: 5m
      snapshot_cache_shards: 64
      snapshot_cache_entries: 10000
      snapshot_cache_bytes: 268435456
      snapshot_cache_ttl: 30s
      snapshot_l2_ttl: 10m
      snapshot_interest_ttl: 30s
      snapshot_interest_keys: 10000
      snapshot_interest_subs: 100000
      marker_cache_ttl: 2s
      snapshot_load_timeout: 3s
      snapshot_max_waiters: 4096
      async_finalize_capacity: 4096
      async_finalize_workers: 16
      transaction_track_limit: 100000
      transaction_track_ttl: 10m
      mongo:
        database: remote_entity
        transaction_ttl: 168h
