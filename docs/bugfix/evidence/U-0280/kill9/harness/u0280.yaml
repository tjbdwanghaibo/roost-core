# U-0280 演练：一个机器人连续向从未进过游戏的玩家 1 赠礼。每个赠礼：debit 扣 1 个药水 → deliver 拒绝
# → 退款（debit 的补偿）把它还回来，saga 以 compensated 结束。背包数守恒：全部 saga 终结后，背包等于加入的总数。
scenarios:
  - name: u0280
    node:
      sequence:
        - action: connect
        - action: enter_game
        - action: add_item
          param:
            item_id: 1001
            count: 30
        - loop:
            times: 100000
            node:
              sequence:
                - best_effort:
                    action: send_gift
                    param:
                      to_player_id: 1
                      item_id: 1001
                      count: 1
                - wait: 60ms
